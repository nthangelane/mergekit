apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: mergekit-ga
spec:
  rayVersion: "2.35.0"
  enableInTreeAutoscaling: true
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
    template:
      spec:
        serviceAccountName: default
        containers:
          - name: ray-head
            image: "__MERGEKIT_IMAGE__"
            imagePullPolicy: IfNotPresent
            command: ["/bin/bash", "-lc", "ray start --head --port=6379 --dashboard-host=0.0.0.0 --dashboard-port=8265"]
            env:
              - name: AWS_REGION
                value: "us-east-1"
              - name: HF_HOME
                value: /data/hf
              - name: MERGEKIT_DATA_DIR
                value: /data/artifacts
            volumeMounts:
              - name: shared-tmp
                mountPath: /tmp/ray
              - name: hf-cache
                mountPath: /data/hf
              - name: artifacts
                mountPath: /data/artifacts
        volumes:
          - name: shared-tmp
            emptyDir: {}
          - name: hf-cache
            emptyDir: {}
          - name: artifacts
            emptyDir: {}
  workerGroupSpecs:
    - groupName: cpu-workers
      replicas: 2
      minReplicas: 1
      maxReplicas: 5
      rayStartParams:
        address: auto
        num-cpus: "4"
      template:
        spec:
          containers:
            - name: ray-worker
              image: "__MERGEKIT_IMAGE__"
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-lc", "ray start --address=$RAY_HEAD_IP:6379"]
              env:
                - name: AWS_REGION
                  value: "us-east-1"
                - name: HF_HOME
                  value: /data/hf
                - name: MERGEKIT_DATA_DIR
                  value: /data/artifacts
              resources:
                requests:
                  cpu: "2"
                  memory: "8Gi"
                limits:
                  cpu: "4"
                  memory: "8Gi"
              volumeMounts:
                - name: shared-tmp
                  mountPath: /tmp/ray
                - name: hf-cache
                  mountPath: /data/hf
                - name: artifacts
                  mountPath: /data/artifacts
          volumes:
            - name: shared-tmp
              emptyDir: {}
            - name: hf-cache
              emptyDir: {}
            - name: artifacts
              emptyDir: {}
    - groupName: gpu-workers
      replicas: 0
      minReplicas: 0
      maxReplicas: 2
      rayStartParams:
        address: auto
        num-gpus: "1"
      template:
        spec:
          tolerations:
            - key: "nvidia.com/gpu"
              operator: Exists
              effect: NoSchedule
          containers:
            - name: ray-worker
              image: "__MERGEKIT_IMAGE__"
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-lc", "ray start --address=$RAY_HEAD_IP:6379"]
              env:
                - name: AWS_REGION
                  value: "us-east-1"
                - name: HF_HOME
                  value: /data/hf
                - name: MERGEKIT_DATA_DIR
                  value: /data/artifacts
              resources:
                requests:
                  cpu: "4"
                  memory: "16Gi"
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "8"
                  memory: "32Gi"
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: shared-tmp
                  mountPath: /tmp/ray
                - name: hf-cache
                  mountPath: /data/hf
                - name: artifacts
                  mountPath: /data/artifacts
          volumes:
            - name: shared-tmp
              emptyDir: {}
            - name: hf-cache
              emptyDir: {}
            - name: artifacts
              emptyDir: {}
