apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: mergekit-ga-job
  annotations:
    mergekit/run-purpose: "ga-experiment"
spec:
  entrypoint: >-
    python -m mergekit.scripts.evolve_ga
    --config /workspace/examples/evolve_ga_m1_micro.yml
    --output-dir /data/artifacts/runs/${RAY_JOB_ID}
  runtimeEnvYAML: |
    working_dir: "/workspace"
    env_vars:
      HF_HOME: "/data/hf"
      MERGEKIT_DATA_DIR: "/data/artifacts"
      AWS_REGION: "us-east-1"
    pip:
      - "mergekit[eks,evolve-ga]"
  clusterSelector:
    rayClusterName: mergekit-ga
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 3600
