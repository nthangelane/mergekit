# GA evolution config tailored for Apple M1 laptops (16 GB unified memory).
# Uses tiny Pythia checkpoints that fit comfortably on CPU/MPS and keeps the
# population small to limit concurrent memory usage.

genome:
  type: multi_method # Enable method + model-aware evolution on tiny hardware

  models:
    - Qwen/Qwen2.5-0.5B
    - Qwen/Qwen2.5-0.5B-Instruct
    - Qwen/Qwen2-0.5B-Instruct
    - Qwen/Qwen1.5-0.5B
    - Qwen/Qwen1.5-0.5B-Chat

  base_model: Qwen/Qwen2.5-0.5B
  tokenizer_source: base # Reuse base tokenizer to avoid vocab drift
  allowed_methods:
    - slerp # Fast interpolation when tensors align
    - nuslerp # Slerp with adaptive weighting for coarse adjustments
    - linear # Classic weighted averaging
    - dare_linear # Task vectors with density control (2-model slices)
    - dare_ties # Sparse task vectors for exploration

  layer_granularity: 4 # Operate on 4-layer blocks to allow per-block method changes
  max_models_per_layer: 2 # Keep selections tiny (pairs) for 16 GB unified memory
  normalize: true # Normalize parameter slices before applying merges
  enable_method_evolution: true
  enable_model_selection: true

tasks:
  - name: wikitext
    weight: 1
    metric: ppl,none
  - name: lambada_openai
    weight: 0.6
    metric: acc,none
  - name: sst2
    weight: 0.4
    metric: acc,none
  - name: sciq
    weight: 0.5
    metric: acc,none

random_init: false # Start from equal weighting for deterministic runs

# Conservative GA hyperparameters for memory-limited hardware
ga:
  population_size: 6 # Slightly larger to explore per-block method combos
  elite_fraction: 0.5 # Retain top 3 individuals each generation
  mutation_rate: 0.24
  mutation_sigma: 0.05
  crossover: semantic # Unlock semantic crossover for multi-method genome
  semantic_crossover_prob: 0.85
  method_mutation_rate: 0.22
  model_mutation_rate: 0.18
  parameter_mutation_rate: 0.28
  tournament_size: 2

# Evaluation limits keep lm-eval fast on CPU / MPS
limit: 48
num_fewshot: 0
