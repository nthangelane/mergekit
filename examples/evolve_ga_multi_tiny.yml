# Example GA evolution config using 4 different tiny models.
# This tests CPU-based evolution with multiple small compatible models
# All models are from the same family to ensure shape compatibility.

genome:
  merge_method: linear
  models:
    - EleutherAI/pythia-70m-deduped   # Base model
    - EleutherAI/pythia-70m           # Same size, different training
    - EleutherAI/pythia-70m-deduped   # Duplicate for testing
    - EleutherAI/pythia-70m           # Another duplicate for 4 models
  # Use full layer range as a single group for simplicity
  layer_granularity: 0

tasks:
  - name: wikitext
    weight: 1.0
    metric: ppl,none

# Start from equal weights with small noise
random_init: false

# GA hyperparameters optimized for quick testing
ga:
  population_size: 3    # Smaller population = more generations
  elite_fraction: 0.33  # Keep top 1 individual  
  mutation_rate: 0.3
  mutation_sigma: 0.08
  crossover: arithmetic
  tournament_size: 2

# Evaluation limits for fast testing
limit: 64             # Small sample for quick evaluation
num_fewshot: 0
