# Minimal GA evolution demo for small language models (SLMs) on Apple M1 hardware.
# Focuses on small Pythia + TinyStories checkpoints, serial CPU execution, and quick lm-eval tasks.

# Multi-method genome keeps merges flexible while respecting tight memory budgets.
genome:
  type: multi_method

  models:
    - EleutherAI/pythia-70m-deduped
    - EleutherAI/pythia-160m-deduped
    - roneneldan/TinyStories-33M


  base_model: EleutherAI/pythia-70m-deduped
  tokenizer_source: base
  allowed_methods:
    - linear
    - dare_linear
    - ties
    - task_arithmetic

  layer_granularity: 0 # Operate on whole-model slices to minimize bookkeeping
  max_models_per_layer: 2
  normalize: true
  allow_negative_weights: false
  enable_method_evolution: true
  enable_model_selection: true

# Two quick lm-eval tasks keep runtime short while detecting improvement.
tasks:
  - name: lambada_openai
    weight: 0.6
    metric: acc,none
  - name: sciq
    weight: 0.4
    metric: acc,none

random_init: false

# Conservative GA hyper-parameters sized for M1 CPU-only runs.
ga:
  population_size: 8
  elite_fraction: 0.375 # Keep the best 3 individuals per generation
  mutation_rate: 0.25
  mutation_sigma: 0.06
  crossover: semantic
  semantic_crossover_prob: 0.5
  method_mutation_rate: 0.2
  model_mutation_rate: 0.15
  parameter_mutation_rate: 0.25
  tournament_size: 2

# Tight eval limits keep each generation under a few minutes on CPU.
limit: 64
num_fewshot: 0
