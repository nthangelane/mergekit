# Local GA evolution config using only cached Pythia-70M-compatible checkpoints.
# This avoids cold-download variance when sizing experiments on a busy machine.

genome:
  type: multi_method

  models:
    - EleutherAI/pythia-70m-deduped
    - lomahony/pythia-70m-helpful-sft
    - mlabonne/chesspythia-70m
    - vineetsharma/databricks-dolly-15k-pythia-70m-deduped-v1
    - taufeeque/wiki-finetuned-pythia-70m-deduped

  base_model: EleutherAI/pythia-70m-deduped
  tokenizer_source: base

  allowed_methods:
    - linear
    - dare_linear
    - ties
    - task_arithmetic

  layer_granularity: 0
  max_models_per_layer: 2
  normalize: true
  allow_negative_weights: false
  enable_method_evolution: true
  enable_model_selection: true

tasks:
  - name: lambada_openai
    weight: 0.6
    metric: acc,none
  - name: sciq
    weight: 0.4
    metric: acc,none

random_init: false

ga:
  population_size: 8
  elite_fraction: 0.375
  mutation_rate: 0.25
  mutation_sigma: 0.06
  crossover: semantic
  semantic_crossover_prob: 0.5
  method_mutation_rate: 0.2
  model_mutation_rate: 0.15
  parameter_mutation_rate: 0.25
  tournament_size: 2

limit: 64
num_fewshot: 0
