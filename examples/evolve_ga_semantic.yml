# Comprehensive multi-method GA evolution config
# This demonstrates the full range of merge methods available for evolution

genome:
  type: multi_method  # Use the enhanced multi-method genome
  models:
    - EleutherAI/pythia-70m-deduped   # Base model (also used as merge input)
    - EleutherAI/pythia-70m           # Different training data
    - EleutherAI/pythia-70m-deduped   # Duplicate for testing variety
    - EleutherAI/pythia-70m           # Another duplicate

  # Multi-method genome settings - now supports ALL merge methods!
  allowed_methods: [
    # Basic methods
    "linear",           # Simple weighted average
    "slerp",           # Spherical interpolation (2 models)
    "nuslerp",         # Enhanced SLERP (2 models)
    "karcher",         # Riemannian barycenter

    # Task arithmetic family
    "task_arithmetic", # Basic task vectors
    "ties",            # Task arithmetic + sparsification
    "dare_ties",       # DARE + TIES
    "dare_linear",     # DARE without consensus
    "della",           # Adaptive magnitude pruning
    "della_linear",    # Linear DELLA
    "breadcrumbs",     # Outlier removal
    "breadcrumbs_ties", # Breadcrumbs + TIES

    # Advanced methods
    "model_stock",     # Geometric weight calculation (3+ models)
    "arcee_fusion",    # Dynamic thresholding (2 models)

    # Special methods
    # "passthrough",   # Copy single model (useful for layer-wise mixing)
  ]

  base_model: EleutherAI/pythia-70m-deduped  # Required for task arithmetic methods
  max_models_per_layer: 4  # Use up to 4 models per layer group
  layer_granularity: 0     # Single layer group for simplicity

  # Enable full evolution capabilities
  enable_method_evolution: true   # 🎯 GA can switch between ALL methods
  enable_model_selection: true    # 🎯 GA can pick optimal model subsets
  allow_negative_weights: false   # Keep weights positive for stability

tasks:
  - name: wikitext
    weight: 1.0
    metric: ppl,none

# Start from sensible defaults
random_init: false

# Enhanced GA parameters for comprehensive semantic operations
ga:
  population_size: 8
  elite_fraction: 0.125  # Keep top 1 individual

  # Use semantic crossover and mutation
  crossover: semantic
  semantic_crossover_prob: 0.95  # 95% chance to use method-aware crossover

  # Semantic mutation rates - tuned for method diversity
  mutation_rate: 0.25            # Overall mutation probability
  method_mutation_rate: 0.15     # 15% chance to switch merge methods
  model_mutation_rate: 0.2       # 20% chance to modify model selection
  parameter_mutation_rate: 0.3   # 30% chance to modify parameters
  mutation_sigma: 0.1            # Moderate noise level

  tournament_size: 3

# Quick evaluation for testing
limit: 64
num_fewshot: 0

# Expected Evolution Behaviors:
# 🔬 Early generations: Explore method diversity (linear, slerp, ties, etc.)
# 🎯 Mid generations: Discover optimal method per model combination
# ⚖️ Late generations: Fine-tune parameters within best methods
# 🏆 Result: Method + model selection + parameters all optimized together!
