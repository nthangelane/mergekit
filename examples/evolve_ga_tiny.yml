# Example GA evolution config using tiny GPT-2 models.
# This is intended as a pipeline smoke test; it runs with small models
# that are fast to download and evaluate. All three sources are the same
# model to guarantee shape compatibility.

genome:
  merge_method: linear
  models:
    - EleutherAI/pythia-70m-deduped
    - EleutherAI/pythia-70m-deduped
    - EleutherAI/pythia-70m-deduped
  # Use full layer range as a single group
  layer_granularity: 0

tasks:
  - name: wikitext
    weight: 1.0
    metric: ppl,none

# Start from equal weights with small noise (false) or random (true)
random_init: false

# GA hyperparameters (CLI flags override these when provided)
ga:
  population_size: 16
  elite_fraction: 0.25
  mutation_rate: 0.2
  mutation_sigma: 0.05
  crossover: arithmetic
  tournament_size: 3

# Optional caps for evaluation
limit: 128            # limit examples per task
num_fewshot: 0        # for tasks that support few-shot
