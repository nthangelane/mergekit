# Experiment 3: Multilingual Base + Instruct Merge
# Verified same-family substitute on 2026-03-15:
#   - requested repos `Qwen/Qwen2-3B` and `Qwen/Qwen2-3B-Instruct` did not resolve
#   - preset uses the verified `Qwen/Qwen2.5-3B` pair
#
# Suggested run:
#   python -m mergekit.scripts.evolve_ga \
#     examples/thesis_exp_03_qwen25_3b_multilingual_merge.yml \
#     --storage-path workspace/thesis_exp_03_qwen25_3b \
#     --max-fevals 224 \
#     --i-understand-the-depths-of-the-evils-i-am-unleashing
#
# Collect separately after the run:
#   - multilingual held-out generation review
#   - richer instruction-following eval if needed

genome:
  type: multi_method

  models:
    - Qwen/Qwen2.5-3B
    - Qwen/Qwen2.5-3B-Instruct

  base_model: Qwen/Qwen2.5-3B
  tokenizer_source: base

  allowed_methods:
    - linear
    - slerp
    - ties
    - dare_linear
    - dare_ties

  layer_granularity: 6
  max_models_per_layer: 2
  normalize: true
  allow_negative_weights: false
  enable_method_evolution: true
  enable_model_selection: true

tasks:
  - name: xnli_vi
    weight: 0.25
    metric: acc,none
  - name: mmlu
    weight: 0.25
    metric: acc,none
  - name: gsm8k
    weight: 0.20
    metric: exact_match,strict-match
  - name: ifeval
    weight: 0.20
    metric: inst_level_strict_acc
  - name: wikitext
    weight: 0.10
    metric: ppl,none

random_init: false

ga:
  population_size: 16
  elite_fraction: 0.25
  mutation_rate: 0.18
  mutation_sigma: 0.04
  crossover: semantic
  semantic_crossover_prob: 0.85
  method_mutation_rate: 0.16
  model_mutation_rate: 0.14
  parameter_mutation_rate: 0.22
  tournament_size: 4

limit: 64
num_fewshot: 0
apply_chat_template: false
fewshot_as_multiturn: false
