# Experiment 6: local phase-3 probe on the stable Pythia-70M pair.
# This remains a tiny-model local validation run, but it now exercises
# layer-aware mixed-method configs, weighted-rank selection, a novelty archive
# bonus, and the expanded method family.

genome:
  type: multi_method

  models:
    - lomahony/pythia-70m-helpful-sft
    - EleutherAI/pythia-70m-deduped

  base_model: EleutherAI/pythia-70m-deduped
  tokenizer_source: base

  allowed_methods:
    - passthrough
    - linear
    - slerp
    - ties
    - dare_linear
    - dare_ties

  layer_granularity: 2
  max_models_per_layer: 2
  normalize: true
  allow_negative_weights: false
  enable_method_evolution: true
  enable_model_selection: true

tasks:
  - name: wikitext
    weight: 0.35
    metric: byte_perplexity,none
  - name: boolq
    weight: 0.35
    metric: acc,none
  - name: sciq
    weight: 0.30
    metric: acc,none

two_stage: true
stage1_tasks:
  - name: wikitext
    weight: 0.30
    metric: byte_perplexity,none
  - name: boolq
    weight: 0.35
    metric: acc,none
  - name: sciq
    weight: 0.35
    metric: acc,none
stage1_limit: 1
stage2_limit: 2
stage2_top_k: 2

fitness_mode: weighted_rank
task_mix_profile: pythia70m_phase3

behavior_prompts:
  - "Q: What is the capital of France?\nA:"
  - "Answer with one word. The opposite of hot is"
  - "Finish the sentence: A triangle has"
behavior_probe_max_new_tokens: 20
behavior_repetition_ngram_size: 4
behavior_min_distinct_ratio: 0.15
behavior_reject_on_degenerate: false

random_init: true

ga:
  population_size: 6
  elite_fraction: 0.167
  mutation_rate: 0.10
  mutation_sigma: 0.01
  crossover: semantic
  semantic_crossover_prob: 0.75
  method_mutation_rate: 0.10
  model_mutation_rate: 0.10
  parameter_mutation_rate: 0.10
  tournament_size: 3
  adaptive_method_sampling: true
  initial_method_probs:
    passthrough: 0.15
    linear: 0.25
    slerp: 0.20
    ties: 0.15
    dare_linear: 0.125
    dare_ties: 0.125
  operator_temperature: 1.0
  operator_update_smoothing: 0.20
  operator_avg_child_weight: 0.45
  operator_parent_improvement_weight: 0.35
  operator_survival_weight: 0.20
  passthrough_penalty: 0.02
  passthrough_max_fraction: 0.25
  explorer_fraction: 0.34
  diversity_parent_selection: true
  diversity_parent_weight: 0.20
  gene_diversity_bonus_weight: 0.04
  behavior_diversity_bonus_weight: 0.03
  archive_novelty_bonus_weight: 0.03
  novelty_archive_size: 32
  rank_objective_weights:
    raw_weighted_score: 0.15
    task_score: 0.30
    language_quality: 0.20
    stability_score: 0.15
    gene_diversity_score: 0.10
    behavior_diversity_score: 0.05
    archive_novelty_score: 0.05

limit: 2
num_fewshot: 0
apply_chat_template: false
fewshot_as_multiturn: false
