# Experiment 2.12 — connected pair, audited fidelity + MEMETIC repair (2000 steps, reentry)
# Parents share base EleutherAI/pythia-70m-deduped (provenance-confirmed 15 Jul).
# Identical protocol to thesis_aos_current. Pre-registered prediction: blends
# survive interpolation; at least one child beats at least one parent.

genome:
  type: multi_method

  models:
    - mlabonne/chesspythia-70m
    - vineetsharma/databricks-dolly-15k-pythia-70m-deduped-v1

  base_model: EleutherAI/pythia-70m-deduped
  tokenizer_source: base

  allowed_methods:
    - passthrough
    - linear
    - slerp

  layer_granularity: 0
  max_models_per_layer: 2
  normalize: true
  allow_negative_weights: false
  enable_method_evolution: true
  enable_model_selection: true

optimizer: enhanced
fitness:
  version: v2

tasks:
  - name: wikitext
    weight: 0.40
    metric: byte_perplexity,none
  - name: boolq
    weight: 0.35
    metric: acc,none
  - name: sciq
    weight: 0.25
    metric: acc,none

two_stage: true
stage1_tasks:
  - name: wikitext
    weight: 0.30
    metric: byte_perplexity,none
  - name: boolq
    weight: 0.30
    metric: acc,none
  - name: sciq
    weight: 0.40
    metric: acc,none
stage1_limit: 4
stage2_limit: 12
stage2_top_k: 4

fitness_mode: structured_phase1_tiny
task_mix_profile: pythia70m_phase1

behavior_prompts:
  - "Q: What is the capital of France?\nA:"
  - "Answer with one word. The opposite of hot is"
  - "Finish the sentence: A triangle has"
behavior_probe_max_new_tokens: 20
behavior_repetition_ngram_size: 4
behavior_min_distinct_ratio: 0.15
behavior_reject_on_degenerate: false

random_init: false

ga:
  population_size: 8
  elite_fraction: 0.125
  mutation_rate: 0.10
  mutation_sigma: 0.015
  crossover: semantic
  semantic_crossover_prob: 0.75
  method_mutation_rate: 0.10
  model_mutation_rate: 0.10
  parameter_mutation_rate: 0.10
  tournament_size: 3
  adaptive_method_sampling: true
  initial_method_probs:
    passthrough: 0.25
    linear: 0.45
    slerp: 0.30
  operator_temperature: 1.0
  operator_update_smoothing: 0.20
  operator_avg_child_weight: 0.50
  operator_parent_improvement_weight: 0.30
  operator_survival_weight: 0.20
  passthrough_penalty: 0.02
  passthrough_max_fraction: 0.30
  explorer_fraction: 0.25
  diversity_parent_selection: true
  diversity_parent_weight: 0.20
  gene_diversity_bonus_weight: 0.04
  behavior_diversity_bonus_weight: 0.03

stop:
  max_fevals: 192
  max_time_seconds: 14400
  target_improvement_pct: 5.0
  target_reference: best_baseline
  min_generations_before_target_stop: 5
  require_stage2_for_target: true
  stagnation_patience_generations: 8
  stagnation_min_delta: 0.005

limit: 12
num_fewshot: 0
apply_chat_template: false
fewshot_as_multiturn: false

# --- Campaign 2 fidelity additions (E9/E10) ---
audit:
  enabled: true
  every_generations: 3
  top_n: 1
  limit: 500            # 500 examples/task = ~40x stage fidelity; bounded on M1
  replace_cached_score: true
  final_audit: true
audit_max_total_seconds: 10800
metric_guard_mode: quarantine
quarantine_audit_limit: 100

# --- E11 memetic repair ---
repair:
  enabled: true
  probe_steps: 100
  max_steps: 2000
  gate_min_slope: 0.0005
  tau_distill: 2.0
  corpus: wikitext-train-slice
  lr: 0.00001
  batch_size: 4
  seq_len: 256
  reentry: true
  reentry_min_gain: 0.02
  max_reentries: 2
