# Random search baseline for thesis GA comparison
# This config disables all evolutionary operators and uses pure random sampling
# at identical feval budget (N=96) to establish whether GA selection/crossover/mutation
# provide genuine value over naive random candidate generation.
#
# All GA hyperparameters are neutralised:
# - population_size=1: evaluate each candidate independently
# - crossover=uniform: schema-required field; never fires at pop=1 (no second parent exists)
# - mutation_rate=0.0: no within-candidate perturbation
# - adaptive_method_sampling=false: no operator adaptation
# - tournament_size=1: no selection pressure
# - elite_fraction=0.0: no elitism/carry-over
# - explorer_fraction=0.0: no explorers (meaningless at pop=1)
# - stage2_top_k=1: matches population size (avoids promoting non-existent candidates)
# - random_init=true: each candidate randomly initialised

genome:
  type: multi_method

  models:
    - lomahony/pythia-70m-helpful-sft
    - EleutherAI/pythia-70m-deduped

  base_model: EleutherAI/pythia-70m-deduped
  tokenizer_source: base

  allowed_methods:
    - passthrough
    - linear
    - slerp

  layer_granularity: 0
  max_models_per_layer: 2
  normalize: true
  allow_negative_weights: false
  enable_method_evolution: true
  enable_model_selection: true

tasks:
  - name: wikitext
    weight: 0.40
    metric: byte_perplexity,none
  - name: boolq
    weight: 0.35
    metric: acc,none
  - name: sciq
    weight: 0.25
    metric: acc,none

two_stage: true
stage1_tasks:
  - name: wikitext
    weight: 0.30
    metric: byte_perplexity,none
  - name: boolq
    weight: 0.30
    metric: acc,none
  - name: sciq
    weight: 0.40
    metric: acc,none
stage1_limit: 4
stage2_limit: 12
stage2_top_k: 1           # must not exceed population_size

fitness_mode: structured_phase1_tiny
task_mix_profile: pythia70m_phase1

behavior_prompts:
  - "Q: What is the capital of France?\nA:"
  - "Answer with one word. The opposite of hot is"
  - "Finish the sentence: A triangle has"
behavior_probe_max_new_tokens: 20
behavior_repetition_ngram_size: 4
behavior_min_distinct_ratio: 0.15
behavior_reject_on_degenerate: false

random_init: true

ga:
  population_size: 1
  elite_fraction: 0.0
  mutation_rate: 0.0
  mutation_sigma: 0.015
  crossover: uniform        # schema requires a valid type; never fires at population_size=1
  semantic_crossover_prob: 0.0
  method_mutation_rate: 0.0
  model_mutation_rate: 0.0
  parameter_mutation_rate: 0.0
  tournament_size: 1
  adaptive_method_sampling: false
  initial_method_probs:
    passthrough: 0.25
    linear: 0.45
    slerp: 0.30
  operator_temperature: 1.0
  operator_update_smoothing: 0.20
  operator_avg_child_weight: 0.50
  operator_parent_improvement_weight: 0.30
  operator_survival_weight: 0.20
  passthrough_penalty: 0.02
  passthrough_max_fraction: 0.30
  explorer_fraction: 0.0    # no explorers at pop=1
  diversity_parent_selection: false
  diversity_parent_weight: 0.0
  gene_diversity_bonus_weight: 0.0
  behavior_diversity_bonus_weight: 0.0

stop:
  max_fevals: 96
  max_time_seconds: 14400
  target_improvement_pct: 5.0
  target_reference: best_baseline
  min_generations_before_target_stop: 5
  require_stage2_for_target: true
  stagnation_patience_generations: 8
  stagnation_min_delta: 0.005

limit: 12
num_fewshot: 0
apply_chat_template: false
fewshot_as_multiturn: false
