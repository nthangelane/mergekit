# Experiment 9: Pythia-70M minimal pooled merge diagnostic
# Goal: isolate the first pooled merge/eval wave on EKS with the smallest
# possible adaptive-GA workload that still exercises an actual merge path.

genome:
  type: multi_method

  models:
    - lomahony/pythia-70m-helpful-sft
    - EleutherAI/pythia-70m-deduped

  base_model: EleutherAI/pythia-70m-deduped
  tokenizer_source: base

  allowed_methods:
    - linear

  layer_granularity: 0
  max_models_per_layer: 2
  normalize: true
  allow_negative_weights: false
  enable_method_evolution: false
  enable_model_selection: false

optimizer: enhanced
fitness:
  version: v2

tasks:
  - name: wikitext
    weight: 0.40
    metric: byte_perplexity,none
  - name: boolq
    weight: 0.35
    metric: acc,none
  - name: sciq
    weight: 0.25
    metric: acc,none

two_stage: true
stage1_tasks:
  - name: wikitext
    weight: 0.40
    metric: byte_perplexity,none
  - name: boolq
    weight: 0.35
    metric: acc,none
  - name: sciq
    weight: 0.25
    metric: acc,none
stage1_limit: 2
stage2_limit: 4
stage2_top_k: 1

fitness_mode: structured_phase1_tiny
task_mix_profile: pythia70m_phase1

behavior_prompts:
  - "Q: What is the capital of France?\nA:"
behavior_probe_max_new_tokens: 12
behavior_repetition_ngram_size: 4
behavior_min_distinct_ratio: 0.10
behavior_reject_on_degenerate: false

random_init: false

ga:
  population_size: 2
  elite_fraction: 0.50
  mutation_rate: 0.0
  mutation_sigma: 0.0
  crossover: arithmetic
  tournament_size: 2
  adaptive_method_sampling: false
  diversity_parent_selection: false
  gene_diversity_bonus_weight: 0.0
  behavior_diversity_bonus_weight: 0.0

stop:
  max_fevals: 2
  max_time_seconds: 1800
  target_reference: best_baseline

limit: 4
num_fewshot: 0
apply_chat_template: false
fewshot_as_multiturn: false
